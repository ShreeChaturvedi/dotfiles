shell_integration no-rc no-cursor

font_family GeistMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.5
disable_ligatures never
adjust_line_height 1
adjust_column_width 0
box_drawing_scale 0.001, 0.001, 0.001, 0.001

cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

scrollback_lines 20000
enable_audio_bell no
visual_bell_duration 0.0
remember_window_size yes
initial_window_width 140c
initial_window_height 42c
confirm_os_window_close 0
hide_window_decorations yes
placement_strategy center
window_padding_width 10 250 10 250
tab_bar_min_tabs 2
tab_bar_style powerline
tab_powerline_style slanted

action_alias split_right launch --location=vsplit --cwd=current
action_alias split_down launch --location=hsplit --cwd=current

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd
map ctrl+alt+enter split_right
map ctrl+alt+j split_down
map ctrl+shift+z scroll_to_prompt -1
map ctrl+shift+x scroll_to_prompt 1
map ctrl+shift+g show_last_command_output
map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab
map ctrl+shift+r load_config_file

# ctrl+shift+k/j: kitty's own scrollback is empty under tmux, so forward these
# as custom sequences that tmux binds to scroll-up/scroll-down (see ~/.tmux.conf)
map ctrl+shift+k send_text all \x1b[5;30012~
map ctrl+shift+j send_text all \x1b[5;30013~

allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

map ctrl+shift+f launch --type=background ~/.config/kitty/toggle-width.sh

include pi-harness.conf

# After pi-harness so gruvbox-dark-medium does not override your theme
include current-theme.conf
