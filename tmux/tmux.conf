# ~/.tmux.conf

bind-key x kill-pane

# reload config: prefix + r
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# vim-style pane navigation: prefix + h/j/k/l  (-r = repeatable within repeat-time)
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

# prefix + l was last-window; moved here since l is now "pane right"
bind-key Tab last-window

# vim-style pane resize: prefix + H/J/K/L
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# vi keys in copy mode: prefix + [ (or prefix + Escape) then hjkl, C-u/C-d, g/G, / to search
setw -g mode-keys vi
bind-key Escape copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ctrl+shift+k / ctrl+shift+j scroll the pane's tmux scrollback.
# kitty sends these as the escape sequences below (see ~/.config/kitty/kitty.conf),
# because a real terminal cannot distinguish ctrl+shift+j from ctrl+j.
# (CSI-u style sequences do NOT work here: tmux's extended-key parser eats them
# before user-keys are matched, so use the CSI ... ~ form.)
set -s user-keys[0] "\e[5;30012~"
set -s user-keys[1] "\e[5;30013~"
bind-key -n User0 copy-mode -e \; send-keys -X -N 3 scroll-up
bind-key -n User1 copy-mode -e \; send-keys -X -N 3 scroll-down
bind-key -T copy-mode-vi User0 send-keys -X -N 3 scroll-up
bind-key -T copy-mode-vi User1 send-keys -X -N 3 scroll-down

# wheel events must reach fullscreen apps (Claude Code) instead of tmux
set -g mouse on

# no ESC lag in vim
set -sg escape-time 0

set -g focus-events on

# true color: without this tmux quantizes kitty's 24-bit colors to 256 (washed out)
set -as terminal-features ",xterm-kitty:RGB:cstyle"
set -g cursor-style bar
# block cursor in copy-mode (ctrl+shift+k); bar when typing
set-hook -g pane-mode-changed {
  if-shell -F '#{pane_in_mode}' {
    set-option -p cursor-style block
  } {
    set-option -p cursor-style bar
  }
}

# prefix + b toggles the status bar
set -g status on
bind-key b set -g status
